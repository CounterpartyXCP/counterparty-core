# cargo-deny configuration for the Counterparty client.
#
# Checked in CI (`cargo deny check`) to gate the Rust wallet's dependency tree on
# security advisories, licenses, banned/duplicate crates, and crate sources.

[advisories]
# Fail on any security vulnerability. Unmaintained/notice advisories are also
# surfaced; the single known one below is triaged and ignored explicitly.
# A yanked dependency (pulled from crates.io after publication, often for a
# security or correctness problem) must also fail the build — cargo-audit does
# not reliably catch these, and the default here is only a warning.
yanked = "deny"
ignore = [
    # bincode 1.3.3 is pulled in transitively by syntect (JSON->YAML output
    # highlighting) and is flagged unmaintained. No security impact; tracked for
    # removal by dropping/replacing syntect's default feature set.
    "RUSTSEC-2025-0141",
    # rkyv 0.7 is an *optional* dependency of rust_decimal that the client never
    # enables — it appears in Cargo.lock only because lockfiles are
    # feature-agnostic, and is never compiled into any binary (verified with
    # `cargo tree -i rkyv --target all`: nothing to print). The fixed version
    # (0.8.17) is unreachable while rust_decimal (latest: 1.42.1) pins rkyv 0.7;
    # drop this ignore when rust_decimal moves to rkyv 0.8.
    "RUSTSEC-2026-0235",
]

[licenses]
# Permissive licenses present in the dependency tree. Anything outside this set
# fails the build so a copyleft/unknown license can never slip in unnoticed.
allow = [
    "MIT",
    "MIT-0",
    "MITNFA",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Skip license evaluation for our own (unpublished-shape) workspace crate.
private = { ignore = true }

[bans]
# The tree legitimately carries a few duplicate versions (e.g. rand 0.8/0.9/0.10
# via transitive deps), so duplicates are a warning, not a hard failure.
multiple-versions = "warn"
# A `*` version requirement pins nothing and lets an unvetted release in on the
# next update; there are none today, so fail the build if one ever appears.
wildcards = "deny"
# The "no OpenSSL/native-tls" supply-chain guarantee (see reqwest's
# `default-features = false` + `rustls` in Cargo.toml) is otherwise only
# enforced by feature selection, which a future dependency bump could silently
# undo. Fail the build outright if any of these ever re-enter the tree.
#
# Note: this bans *system* OpenSSL / native-tls, not all C crypto. The active
# TLS backend is rustls, whose default provider here is `aws-lc-rs` (a vendored,
# statically-linked AWS-LC — C plus some assembly). That is intentional (no
# dependency on the host's OpenSSL, no `native-tls`), but it is not a
# pure-Rust crypto stack; do not read the ban list as such.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
# Only crates.io is an allowed source; an unexpected git or alternate registry
# dependency fails the build.
unknown-registry = "deny"
unknown-git = "deny"
